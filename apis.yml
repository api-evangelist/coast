aid: coast
name: Coast
description: >-
  Coast is a fintech company providing a unified payments platform for
  fleet-based and field-service businesses, combining a smart Visa fuel card,
  corporate card, field card, and bill pay into a single program with granular
  spending controls, GPS- and tank-capacity-based fraud prevention, fuel
  rebates, and a fraud guarantee. Coast operates a stable v2 REST API (the Coast
  API) behind a developer portal that lets businesses programmatically access
  cards, drivers, vehicles, transactions, receipts, and controls, alongside
  native integrations with telematics (Samsara, Geotab, Verizon Connect),
  accounting (QuickBooks, NetSuite, Sage Intacct), and fleet management
  (Fleetio, Whip Around) platforms. Coast is backed by Accel and ICONIQ Capital.
